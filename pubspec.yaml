name: around
description: "Location-based social map app — see friends around you."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Backend
  supabase_flutter: ^2.5.6

  # Map (Naver Cloud Maps Mobile Dynamic Map)
  flutter_naver_map: ^1.4.4
  latlong2: ^0.9.1

  # Location
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # UI / UX
  cached_network_image: ^3.4.1
  pinput: ^5.0.0
  intl_phone_field: ^3.2.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
